spring.application.name=engseg-mobile-backend
server.port=8081

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/engseg}
spring.datasource.username=${DB_USERNAME:engseg}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate

# JWT (mesmo segredo do engseg-api — valida assinatura dos tokens recebidos)
jwt.secret=${JWT_SECRET}
spring.flyway.locations=classpath:db/migration
spring.flyway.table=mobile_flyway_schema_history
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

# Kafka
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=engseg-mobile-backend
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=com.engseg.mobile.event

# Firebase
firebase.service-account-path=${FIREBASE_SERVICE_ACCOUNT_PATH:classpath:firebase-service-account.json}

# engseg-api URL
engseg-api.base-url=${ENGSEG_API_URL:http://localhost:8080}
